<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SOHO-Marks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="site-header">
      <a class="brand" href="#trend" aria-label="SOHO-Marks">SOHO-Marks</a>
      <nav class="main-nav" aria-label="主导航">
        <a href="#trend" data-page="trend">TREND</a>
        <div class="nav-group">
          <a href="#products" data-page="products">PRODUCTS</a>
          <div class="sub-nav">
            <a href="#mens" data-page="mens">MENS</a>
            <a href="#womens" data-page="womens">WOMENS</a>
          </div>
        </div>
        <a href="#about" data-page="about">ABOUT US</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button" id="open-shortlist" aria-label="查看已选款">♡<span id="shortlist-count">0</span></button>
        <button class="icon-button" id="open-subscribe" aria-label="订阅推送">✉</button>
      </div>
    </header>

    <main id="page-root" class="page-root" aria-live="polite"></main>

    <aside id="shortlist-panel" class="side-panel" aria-hidden="true">
      <div class="panel-head"><span>SHORTLIST</span><button class="close-button" data-close-panel>×</button></div>
      <p class="panel-note">把感兴趣的款式加入选款单，方便和客户一起查看。</p>
      <div id="shortlist-items" class="shortlist-items"></div>
      <button class="outline-button" id="download-shortlist">导出选款单</button>
    </aside>

    <div id="detail-modal" class="modal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <button class="modal-close close-button" data-close-modal>×</button>
        <div id="detail-content"></div>
      </div>
    </div>

    <div id="subscribe-modal" class="modal" aria-hidden="true">
      <div class="modal-card small-card" role="dialog" aria-modal="true">
        <button class="modal-close close-button" data-close-modal>×</button>
        <p class="eyebrow">WEEKLY UPDATE</p>
        <h2>每周收到新一批推款</h2>
        <p class="muted">订阅后，盛经理可用邮箱收到本周新增款式和选款链接。</p>
        <form id="subscribe-form" class="subscribe-form">
          <label>收件邮箱<input id="subscribe-email" type="email" required placeholder="name@company.com"></label>
          <button class="solid-button" type="submit">确认订阅</button>
        </form>
        <p id="subscribe-status" class="form-status" role="status"></p>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
